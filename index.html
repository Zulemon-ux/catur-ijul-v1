<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Catur Ijul</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="app">

        <header class="topbar">
            <h1>Catur Ijul</h1>

            <button id="settingsBtn">
                ⚙
            </button>
        </header>


        <section class="game">

            <div class="player">
                <div>
                    <strong>White</strong>
                    <span id="whiteStatus">
                        Your turn
                    </span>
                </div>

                <div id="whiteTimer">
                    10:00
                </div>
            </div>


            <div id="board"></div>


            <div class="player">
                <div>
                    <strong>Black</strong>
                    <span id="blackStatus">
                        Waiting
                    </span>
                </div>

                <div id="blackTimer">
                    10:00
                </div>
            </div>


            <div class="controls">

                <button id="undoBtn">
                    ↶ Undo
                </button>

                <button id="newGameBtn">
                    New Game
                </button>

                <button id="resignBtn">
                    Resign
                </button>

                <button id="flipBoardBtn">
                    ↕ Flip
                </button>

            </div>

        </section>


        <section class="history">

            <div class="history-header">
                <strong>Move History</strong>

                <span id="moveCount">
                    0 moves
                </span>
            </div>

            <div id="moveList"></div>

            <button id="clearHistoryBtn">
                Clear History
            </button>

        </section>

    </main>


    <!-- SETTINGS -->

    <div
        id="settingsModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <button
                id="closeSettingsBtn"
                class="close-btn"
            >
                ×
            </button>

            <h2>Settings</h2>

            <label>
                <input
                    type="checkbox"
                    id="soundToggle"
                    checked
                >
                Sound
            </label>

            <label>
                <input
                    type="checkbox"
                    id="coordinateToggle"
                    checked
                >
                Coordinates
            </label>

            <label>
                <input
                    type="checkbox"
                    id="animationToggle"
                    checked
                >
                Animations
            </label>

        </div>

    </div>


    <!-- GAME RESULT -->

    <div
        id="gameModal"
        class="modal hidden"
    >

        <div class="modal-content result">

            <div id="resultIcon">
                ♕
            </div>

            <h2 id="resultTitle">
                Game Over
            </h2>

            <p id="resultMessage"></p>

            <button id="rematchBtn">
                Rematch
            </button>

            <button id="closeModalBtn">
                Close
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
