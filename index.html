<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess — Modern Chess Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="brand">
                <div class="brand-icon">♞</div>

                <div>
                    <h1>CHESS</h1>
                    <span>Modern Chess</span>
                </div>
            </div>

            <div class="top-actions">

                <button class="icon-btn" id="flipBoardBtn" title="Balik papan">
                    ⇄
                </button>

                <button class="icon-btn" id="settingsBtn" title="Pengaturan">
                    ⚙
                </button>

            </div>

        </header>


        <!-- MAIN GAME -->
        <main class="game-container">

            <!-- PLAYER BLACK -->
            <section class="player player-black">

                <div class="player-info">

                    <div class="avatar black-avatar">
                        ♟
                    </div>

                    <div class="player-name">
                        <strong>Black</strong>
                        <span id="blackStatus">Your opponent</span>
                    </div>

                </div>

                <div class="timer" id="blackTimer">
                    10:00
                </div>

            </section>


            <!-- CHESS BOARD -->
            <section class="board-wrapper">

                <div class="board" id="board">

                    <!-- BOARD WILL BE GENERATED BY JAVASCRIPT -->

                </div>

            </section>


            <!-- PLAYER WHITE -->
            <section class="player player-white">

                <div class="player-info">

                    <div class="avatar white-avatar">
                        ♙
                    </div>

                    <div class="player-name">
                        <strong>White</strong>
                        <span id="whiteStatus">Your turn</span>
                    </div>

                </div>

                <div class="timer active" id="whiteTimer">
                    10:00
                </div>

            </section>


            <!-- GAME CONTROLS -->
            <section class="controls">

                <button class="control-btn" id="undoBtn">
                    <span>↶</span>
                    Undo
                </button>

                <button class="control-btn primary" id="newGameBtn">
                    <span>＋</span>
                    New Game
                </button>

                <button class="control-btn danger" id="resignBtn">
                    <span>⚑</span>
                    Resign
                </button>

            </section>


            <!-- MOVE HISTORY -->
            <section class="history-panel">

                <div class="panel-header">

                    <div>
                        <h2>Game History</h2>
                        <span id="moveCount">0 moves</span>
                    </div>

                    <button id="clearHistoryBtn">
                        Clear
                    </button>

                </div>

                <div class="move-list" id="moveList">

                    <div class="empty-history">
                        <div>♟</div>
                        <p>No moves yet</p>
                        <span>Make your first move</span>
                    </div>

                </div>

            </section>

        </main>


        <!-- GAME RESULT MODAL -->
        <div class="modal hidden" id="gameModal">

            <div class="modal-box">

                <div class="result-icon" id="resultIcon">
                    ♛
                </div>

                <h2 id="resultTitle">
                    Game Over
                </h2>

                <p id="resultMessage">
                    The game has ended.
                </p>

                <div class="modal-actions">

                    <button class="control-btn primary" id="rematchBtn">
                        Play Again
                    </button>

                    <button class="control-btn" id="closeModalBtn">
                        Close
                    </button>

                </div>

            </div>

        </div>


        <!-- SETTINGS MODAL -->
        <div class="modal hidden" id="settingsModal">

            <div class="modal-box settings-box">

                <div class="settings-header">

                    <div>
                        <h2>Settings</h2>
                        <span>Game preferences</span>
                    </div>

                    <button class="close-btn" id="closeSettingsBtn">
                        ×
                    </button>

                </div>


                <div class="setting-item">

                    <div>
                        <strong>Sound</strong>
                        <span>Game movement sounds</span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="soundToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting-item">

                    <div>
                        <strong>Coordinates</strong>
                        <span>Show board coordinates</span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="coordinateToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>


                <div class="setting-item">

                    <div>
                        <strong>Animations</strong>
                        <span>Smooth piece animations</span>
                    </div>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="animationToggle"
                            checked
                        >

                        <span class="slider"></span>

                    </label>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
